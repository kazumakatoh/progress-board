<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>楽天 イロドリ・ラボ ガントチャート</title>
<style>
  :root{
    --done:#34a853; --active:#1a73e8; --late:#ea4335; --todo:#c7ccd1;
    --amber:#f9ab00; --rakuten:#bf0000;
    --grid:#e8eaed; --grid2:#f3f4f6; --ink:#202124; --sub:#5f6368; --today:#ea4335;
    --leftw:486px; /* 240+72+64+110 */
    --daypx:5px;   /* 1日あたりの横幅（月を横スクロールで見せる） */
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:#fff}
  header.top{padding:14px 18px 6px;border-top:4px solid var(--rakuten)}
  h1{font-size:18px;margin:0 0 4px}
  .meta{font-size:12px;color:var(--sub)}
  .toolbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:8px 18px;font-size:12px;border-bottom:1px solid var(--grid);background:#fafafa}
  .legend{display:flex;gap:10px;align-items:center}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .toggle{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;color:var(--sub)}
  .kpi{margin-left:auto;display:flex;gap:16px;font-weight:600}
  .kpi b{color:var(--active)}

  /* 状況サマリー（現状 / 課題 / 改善） */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 18px 4px}
  .card{border:1px solid var(--grid);border-radius:8px;overflow:hidden;background:#fff}
  .card h2{margin:0;font-size:12.5px;font-weight:700;padding:6px 10px;color:#fff}
  .card.now h2{background:var(--active)}
  .card.issue h2{background:var(--late)}
  .card.action h2{background:var(--done)}
  .card ul{margin:0;padding:8px 10px 10px 24px;font-size:11.5px;line-height:1.55;color:#3c4043}
  .card li{margin:0 0 4px}
  @media(max-width:820px){.summary{grid-template-columns:1fr}}

  /* スクロール領域 */
  .wrap{overflow:auto;max-height:calc(100dvh - 96px);position:relative}
  .gantt{width:max-content;position:relative}

  .row{display:flex;min-height:30px}
  .row.section{background:#f5f7fb}
  /* 左の固定ブロック（大項目/タスク・状態・主担当・パートナー） */
  .left{flex:0 0 var(--leftw);display:grid;grid-template-columns:240px 72px 64px 110px;position:sticky;left:0;z-index:3;background:#fff;box-shadow:1px 0 0 var(--grid);border-bottom:1px solid var(--grid2)}
  .row.section .left{background:#f5f7fb;border-bottom:1px solid var(--grid)}
  .c{padding:5px 8px;font-size:12px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--grid);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .c.name{font-size:12.5px;white-space:normal;text-overflow:clip;line-height:1.35;align-items:flex-start;padding-top:6px}
  .row.section .c.name{font-weight:700}
  .row.task .c.name{padding-left:22px;color:#3c4043}
  .c.center{justify-content:center}
  .sub{color:var(--sub);font-size:11px;font-weight:400}

  /* 右のタイムライン（横スクロール本体） */
  .track{position:relative;flex:0 0 auto;border-bottom:1px solid var(--grid2)}
  .row.section .track{border-bottom:1px solid var(--grid)}
  .head .left,.head .track{border-bottom:none}

  /* 固定ヘッダー */
  .head{position:sticky;top:0;z-index:6;background:#fff;border-bottom:2px solid var(--grid)}
  .head .left{z-index:7}
  .head .c{font-weight:700;color:var(--sub);font-size:11.5px;background:#fff}
  .head .track{display:flex;flex-direction:column}
  .months{display:flex}
  .month{flex:0 0 auto;border-right:1px solid var(--grid);font-size:11px;color:var(--sub);text-align:center;padding:5px 0;font-weight:700}
  .milerow{position:relative;height:24px;border-top:1px solid var(--grid)}
  .mile{position:absolute;top:2px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:9.5px;line-height:1.1;white-space:nowrap;color:#b06000}
  .mile b{font-weight:700}
  .mile.key{color:var(--late)}
  .mflag{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid currentColor;margin-bottom:1px}

  /* バー */
  .bar{position:absolute;top:5px;height:18px;border-radius:5px;display:flex;align-items:center;padding:0 6px;color:#fff;font-size:10.5px;white-space:nowrap;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:1}
  .bar.done{background:var(--done)} .bar.active{background:var(--active)}
  .bar.late{background:var(--late)} .bar.todo{background:var(--todo);color:#5f6368}
  .bar.group{background:#9aa0a6;height:8px;top:11px;border-radius:4px;opacity:.55}

  /* 状態バッジ */
  .pill{display:inline-block;padding:1px 8px;border-radius:11px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap}
  .pill.done{background:var(--done)} .pill.active{background:var(--active)}
  .pill.late{background:var(--late)} .pill.todo{background:#9aa0a6}
  .pill.cancel{background:#9aa0a6;text-decoration:line-through}
  .bar.cancel{background:#dadce0;color:#80868b}
  .row.cancel .c.name{color:#9aa0a6;text-decoration:line-through}

  /* 達成率（大項目） */
  .prog{display:flex;align-items:center;gap:6px;width:100%}
  .pbar{flex:1;height:8px;background:#e3e6ea;border-radius:5px;overflow:hidden}
  .pfill{height:100%;border-radius:5px}
  .pnum{font-size:11px;font-weight:700;min-width:30px;text-align:right}

  /* 今日ライン・グリッド（タイムライン上のオーバーレイ） */
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2}
  .today::after{content:"今日";position:absolute;top:56px;left:3px;font-size:10px;color:var(--today);font-weight:700;background:#fff;padding:0 2px}
  .gridlines{position:absolute;top:0;bottom:0;left:var(--leftw);display:flex;pointer-events:none;z-index:0}
  .gl{flex:0 0 auto;border-right:1px solid var(--grid2)}
  footer{padding:10px 18px;font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<header class="top">
  <h1>🛒 楽天「イロドリ・ラボ」ガントチャート</h1>
  <div class="meta">楽天は<b>在庫消化フェーズ</b>（追加登録・追加仕入なし）。今後は<b>自社ブランド販売のプラットフォーム</b>として活用。完了タスクは整理済み</div>
</header>
<div class="toolbar">
  <div class="legend">
    <span><i class="sw" style="background:var(--done)"></i>完了</span>
    <span><i class="sw" style="background:var(--active)"></i>進行中</span>
    <span><i class="sw" style="background:var(--late)"></i>遅延</span>
    <span><i class="sw" style="background:var(--todo)"></i>未着手</span>
  </div>
  <label class="toggle"><input type="checkbox" id="showDone"> 完了も表示</label>
  <div class="kpi" id="kpi"></div>
</div>

<section class="summary" id="summary"></section>

<div class="wrap">
  <div class="gantt" id="gantt"></div>
</div>
<footer>※ 既定では<b>完了タスクを非表示</b>（「完了も表示」で表示）。左4列は固定、月は横スクロール。「今日」ラインは閲覧日に自動追従。　<b>最終更新：<span id="upd"></span></b></footer>

<script>
const RANGE_START="2026-05-01", RANGE_END="2026-12-31";
// 重要イベント（月→ラベル）
const MILESTONES={ "6月":{t:"販売開始/検証"}, "8月":{t:"検証結論:販売手法を見直し",key:true}, "9月":{t:"写ルンです 追加納品"}, "12月":{t:"在庫消化を継続"} };
const UPDATED="2026-08-31";
// 状況サマリー（現状 / 課題 / 改善）※状況が変わったら書き換える
const STATUS={
  現状:[
    "Amazon式の販売（高単価×独自カタログ×RPP広告）を楽天へ転用したが、検証の結果 <b>楽天では通用しにくい</b>と結論。",
    "現在は<b>追加の商品登録・追加仕入はせず</b>、既存在庫（チェキ／CANON純正インク／写ルンです）の<b>販売・在庫消化フェーズ</b>。",
    "受注・売上はRMS APIで日次自動集計（GAS＋スプレッドシート）、会計はMoneyForward連携で自動化。",
  ],
  課題:[
    "既存在庫の消化。特に<b>富士フイルム『写ルンです』は在庫が多く</b>、追加納品して売り切る。",
    "チェキ・CANON純正インクは<b>追加仕入なし</b>。売れ残りは値引き等で消化。",
    "楽天運用の負荷を最小化し、リソースを自社ブランド開発へ振り向ける。",
  ],
  改善:[
    "今後の方針は、楽天を<b>『自社ブランドを販売するプラットフォーム』</b>として活用する（当面これ以外は考えない）。",
    "外注化・運用担当の採用は売上が伴わないため<b>一旦停止（凍結）</b>。",
    "在庫消化を進めつつ、自社ブランドの投入に備える。",
  ],
};
const DATA = [
 {s:"1. 楽天 現行運用：在庫消化（追加登録・追加仕入なし）", t:[
   {n:"既存在庫（チェキ／CANON純正インク／写ルンです）を販売継続（追加施策なし・様子見）", o:"社長", a:"2026-08-01", b:"2026-12-31"},
   {n:"写ルンです：富士フイルム在庫を追加納品して消化", o:"社長", a:"2026-09-01", b:"2026-11-30"},
   {n:"チェキ・CANON純正インクは追加仕入なし（在庫消化のみ・売れ残りは値引き検討）", o:"社長", a:"2026-08-01", b:"2026-12-31"},
 ]},
 {s:"2. 商品ラインナップ拡充（自社ブランド軸）", t:[
   {n:"楽天を自社ブランド販売のプラットフォームとして活用（当面これ以外は考えない）", o:"社長", a:"2026-08-01", b:"2026-12-31"},
   {n:"自社ブランドの投入準備", o:"社長", a:"2026-10-01", b:"2026-12-31"},
 ]},
 {s:"3. 外注化・運用担当（一旦停止）", t:[
   {n:"外注化・運用担当の採用は売上が伴わないため一旦停止（凍結）", o:"社長", a:"2026-08-01", b:"2026-12-31", x:true},
 ]},
 {s:"4. 事業集計・会計（自動化・稼働中）", t:[
   {n:"RMS受注APIで受注・売上を日次自動集計（GAS＋スプレッドシート）", o:"社長/AI", a:"2026-08-01", b:"2026-12-31"},
   {n:"MoneyForward連携で会計処理を自動化", o:"社長", a:"2026-08-01", b:"2026-12-31"},
 ]},
];

const DAY=86400000;
const r0=new Date(RANGE_START), r1=new Date(RANGE_END);
const totalDays=Math.round((r1-r0)/DAY)+1;
const DAYPX=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--daypx'))||5;
const TW=totalDays*DAYPX; // タイムライン全幅(px)
const today=new Date(); today.setHours(0,0,0,0);
const pos=d=>((new Date(d)-r0)/DAY)*DAYPX;          // px
const wid=(a,b)=>(((new Date(b)-new Date(a))/DAY)+1)*DAYPX; // px
const STLABEL={done:"完了",active:"進行中",late:"遅延",todo:"未着手",cancel:"中止"};
function status(t){ if(t.x)return"cancel"; if(t.d)return"done"; const a=new Date(t.a),b=new Date(t.b);
  if(b<today)return"late"; if(a<=today&&today<=b)return"active"; return"todo"; }
function owner(o){ if(!o)return["",""]; const p=o.split("/"); return [p[0], p.slice(1).join("・")]; }
function pctColor(p){ return p>=100?"var(--done)":p>=50?"var(--active)":p>0?"var(--amber)":"var(--todo)"; }

// 月（left/width px）
const months=[]; let m=new Date(r0), acc=0;
while(m<=r1){
  const next=new Date(m.getFullYear(),m.getMonth()+1,1);
  const end=next>r1?new Date(r1.getTime()+DAY):next;
  const w=((end-m)/DAY)*DAYPX;
  months.push({label:(m.getMonth()+1)+"月", left:acc, w}); acc+=w; m=next;
}

const g=document.getElementById("gantt");
function render(showDone){
  let h="";
  // グリッド線・今日ライン（タイムライン全幅ぶんのオーバーレイ）
  h+='<div class="gridlines">'+months.map(mo=>`<div class="gl" style="width:${mo.w}px"></div>`).join("")+'</div>';
  const tp=pos(today.toISOString().slice(0,10));
  if(tp>=0&&tp<=TW) h+=`<div class="today" style="left:calc(var(--leftw) + ${tp}px)"></div>`;

  // 固定ヘッダー
  const monthsHtml=months.map(mo=>`<div class="month" style="width:${mo.w}px">${mo.label}</div>`).join("");
  const milesHtml=months.map(mo=>{ const mi=MILESTONES[mo.label]; if(!mi)return""; const c=mo.left+mo.w/2;
    return `<div class="mile ${mi.key?'key':''}" style="left:${c}px"><span class="mflag"></span><b>${mi.t}</b></div>`; }).join("");
  h+=`<div class="row head">
    <div class="left">
      <div class="c name">大項目 / タスク</div>
      <div class="c center">状態</div>
      <div class="c center">主担当</div>
      <div class="c center">パートナー</div>
    </div>
    <div class="track" style="width:${TW}px"><div class="months">${monthsHtml}</div><div class="milerow">${milesHtml}</div></div>
  </div>`;

  let done=0,total=0,late=0;
  DATA.forEach(sec=>{
    const a=sec.t.reduce((p,t)=>new Date(t.a)<new Date(p)?t.a:p, sec.t[0].a);
    const b=sec.t.reduce((p,t)=>new Date(t.b)>new Date(p)?t.b:p, sec.t[0].b);
    const act=sec.t.filter(t=>!t.x);
    const dc=act.filter(t=>t.d).length, tot=act.length, pc=tot?Math.round(dc/tot*100):0;
    // 表示するタスク（完了は既定で隠す。中止は隠さない）
    const vis=sec.t.filter(t=>showDone || status(t)!=="done");
    // カウント（KPIは全タスク基準）
    sec.t.forEach(t=>{ const st=status(t); if(st!=="cancel"){ total++; if(st==="done")done++; if(st==="late")late++; } });
    if(vis.length===0) return; // 完了のみのセクションは非表示
    h+=`<div class="row section">
      <div class="left">
        <div class="c name">${sec.s}<span class="sub">(${dc}/${tot})</span></div>
        <div class="c" style="grid-column:2 / 5">
          <div class="prog"><div class="pbar"><div class="pfill" style="width:${pc}%;background:${pctColor(pc)}"></div></div><span class="pnum" style="color:${pctColor(pc)}">${pc}%</span></div>
        </div>
      </div>
      <div class="track" style="width:${TW}px"><div class="bar group" style="left:${pos(a)}px;width:${wid(a,b)}px"></div></div>
    </div>`;
    vis.forEach(t=>{
      const st=status(t);
      const [mn,pt]=owner(t.o);
      const lbl=(st==="done"?"✓ ":st==="late"?"⚠ ":st==="cancel"?"✕ ":"");
      h+=`<div class="row task${st==="cancel"?" cancel":""}">
        <div class="left">
          <div class="c name" title="${t.n}">${t.n}</div>
          <div class="c center"><span class="pill ${st}">${STLABEL[st]}</span></div>
          <div class="c center">${mn||"–"}</div>
          <div class="c center"><span class="sub">${pt||"–"}</span></div>
        </div>
        <div class="track" style="width:${TW}px"><div class="bar ${st}" style="left:${pos(t.a)}px;width:${wid(t.a,t.b)}px">${lbl}</div></div>
      </div>`;
    });
  });
  g.innerHTML=h;
  document.getElementById("kpi").innerHTML=`タスク <b>${total}</b>　フェーズ <b>在庫消化</b>　方針 <b>自社ブランドの販売PFとして活用</b>`;
}

// 状況サマリー描画（現状/課題/改善）
document.getElementById("upd").textContent=UPDATED;
const cardMeta=[["now","現状","🔵"],["issue","課題","🔴"],["action","改善","🟢"]];
document.getElementById("summary").innerHTML=cardMeta.map(function(cm){
  return `<div class="card ${cm[0]}"><h2>${cm[2]} ${cm[1]}</h2><ul>${STATUS[cm[1]].map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
}).join("");

const chk=document.getElementById("showDone");
chk.addEventListener("change",()=>render(chk.checked));
render(false);
</script>
</body>
</html>
